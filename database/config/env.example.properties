# Copie para .env na raiz do projeto e preencha com valores reais.

# Servidor HTTP da API Satelite
SERVER_PORT=9090
PORTA_API=9090

# SQL Server
DB_SERVER=localhost
DB_NAME=SATELITE_TMS_AUDITORIA
DB_TRUST_SERVER_CERTIFICATE=true
DB_URL=jdbc:sqlserver://localhost:1433;databaseName=SATELITE_TMS_AUDITORIA;encrypt=true;trustServerCertificate=true
DB_ADMIN_USER=
DB_ADMIN_PASSWORD=
DB_USER=sa
DB_PASSWORD=SUA_SENHA
SATELITE_DB_URL=jdbc:sqlserver://localhost:1433;databaseName=SATELITE_TMS_AUDITORIA;encrypt=true;trustServerCertificate=true
SATELITE_DB_USER=sa
SATELITE_DB_PASSWORD=SUA_SENHA

# Rodogarcia / ESL Cloud
RODOGARCIA_API_BASE_URL=https://api.exemplo-rodogarcia.com.br
RODOGARCIA_CUSTOMER_OCCURRENCES_PATH=/api/customer/invoice_occurrences
RODOGARCIA_CTE_XML_PATH=/api/ctes
# Credencial compartilhada ESL: XML do CT-e e comprovante Vedacit.
RODOGARCIA_MASTER_API_REST=TOKEN_ESL_MASTER_REST
RODOGARCIA_TOKEN_PPG=TOKEN_ESL_PPG
RODOGARCIA_TOKEN_VEDACIT=TOKEN_ESL_VEDACIT
# Opcional: use apenas se a ESL fornecer uma credencial exclusiva para comprovante Vedacit.
RODOGARCIA_TOKEN_VEDACIT_COMPROVANTE=
RODOGARCIA_TOKEN_SELIA=TOKEN_ESL_SELIA
RODOGARCIA_TOKEN_SELIA_COMPROVANTE=TOKEN_ESL_SELIA_COMPROVANTE
RODOGARCIA_CONNECT_TIMEOUT_MS=30000
RODOGARCIA_READ_TIMEOUT_MS=60000

# PPG / OK Entrega
PPG_API_BASE_URL=https://hml.okentrega.com.br
PPG_API_USER=USUARIO_PPG
PPG_API_PASSWORD=SENHA_PPG
PPG_ENTREGADOR_ID=ID_ENTREGADOR
PPG_CNPJ_TRANSPORTADORA=CNPJ_TRANSPORTADORA
PPG_NFE_WHITELIST_ENABLED=false
PPG_NFE_WHITELIST=

# SELIA / Intelipost AddEvents
APP_SELIA_ENABLED=false
SELIA_INTELIPOST_API_BASE_URL=https://api.intelipost.com.br/api/v1
SELIA_INTELIPOST_API_KEY=CHAVE_API_INTELIPOST
SELIA_INTELIPOST_LOGISTIC_PROVIDER_API_KEY=CHAVE_LP_INTELIPOST
SELIA_INTELIPOST_PLATFORM=SATELITE_TMS
SELIA_INTELIPOST_PLATFORM_VERSION=VERSAO_DA_APLICACAO
SELIA_INTELIPOST_PLUGIN=RODOGARCIA_INTELIPOST
SELIA_INTELIPOST_PLUGIN_VERSION=VERSAO_DO_CONECTOR
SELIA_INTELIPOST_DELIVERY_EVENT_CODE=CODIGO_DEPARA_ENTREGA
# Mantido false ate a SELIA confirmar o DePara dos eventos ESL intermediarios.
SELIA_INTELIPOST_ALL_EVENTS_ENABLED=false
# Formato: CODIGO_ESL=CODIGO_INTELIPOST, por exemplo 55=CODIGO_DESPACHADO.
SELIA_INTELIPOST_EVENT_CODE_MAP=
SELIA_INTELIPOST_RECEIPT_TYPE=POD
SELIA_INTELIPOST_RECEIPT_MIME_TYPE=image/jpeg
SELIA_INTELIPOST_RATE_LIMIT_FALLBACK_MS=15000
SELIA_INTELIPOST_PLP_RATE_LIMIT_ENABLED=true
SELIA_INTELIPOST_PLP_RATE_LIMIT_WINDOW_MS=60000
SELIA_INTELIPOST_PLP_RATE_LIMIT_MAX_REQUESTS_PER_KEY=60
SELIA_INTELIPOST_PLP_RATE_LIMIT_MAX_REQUESTS_PER_IP=120
SELIA_INTELIPOST_PLP_RATE_LIMIT_MAX_BUCKETS=10000
SELIA_INTELIPOST_PLP_MAX_BODY_BYTES=5242880
SELIA_INTELIPOST_CONNECT_TIMEOUT_MS=30000

# WORK-SFTP-CLIENTES (sem segredos no repositorio)
# Lista ordenada de identificadores imutaveis. O worker processa um perfil por vez.
# Cada identificador deve usar somente A-Z, 0-9 e _. Exemplo: VEDACIT,CLIENTE_B.
SFTP_CLIENTS_ENABLED=false
SFTP_CLIENTS_IDS=VEDACIT
SFTP_CLIENT_VEDACIT_ENABLED=false
SFTP_CLIENT_VEDACIT_HOST=
SFTP_CLIENT_VEDACIT_PORT=22
SFTP_CLIENT_VEDACIT_USERNAME=
SFTP_CLIENT_VEDACIT_PASSWORD=
SFTP_CLIENT_VEDACIT_BASE_PATH=/g_rodogarcia
SFTP_CLIENT_VEDACIT_PATH=/g_rodogarcia/VEDACIT
SFTP_CLIENT_VEDACIT_HOST_KEY_SHA256=
SFTP_CLIENT_VEDACIT_MAX_FILES_PER_CYCLE=100
SFTP_CLIENT_VEDACIT_MAX_FILE_SIZE_BYTES=26214400
SFTP_CLIENT_VEDACIT_STABLE_FOR_MS=120000

# Para adicionar outro cliente, inclua-o em SFTP_CLIENTS_IDS e replique todas as
# chaves SFTP_CLIENT_<IDENTIFICADOR>_*. Credenciais nunca vao ao PM2 ou aos logs.

# Origem SFTP Vedacit legada, exclusiva para os scripts manuais existentes.
# O futuro WORK-SFTP-CLIENTES usara somente o contrato SFTP_CLIENTS acima.
SFTP_RODOGARCIA_ENABLED=false
SFTP_RODOGARCIA_HOST=
SFTP_RODOGARCIA_PORT=22
SFTP_RODOGARCIA_USERNAME=
SFTP_RODOGARCIA_PASSWORD=
SFTP_RODOGARCIA_BASE_PATH=/g_rodogarcia
SFTP_RODOGARCIA_CLIENT_PATH=
SFTP_RODOGARCIA_HOST_KEY_SHA256=
SFTP_RODOGARCIA_MAX_FILES_PER_CYCLE=100
SFTP_RODOGARCIA_MAX_FILE_SIZE_BYTES=26214400
SFTP_RODOGARCIA_STABLE_FOR_MS=120000
SELIA_INTELIPOST_READ_TIMEOUT_MS=60000
SELIA_INTELIPOST_PLP_ENABLED=false
SELIA_NFE_WHITELIST_ENABLED=false
SELIA_NFE_WHITELIST=

# Vedacit / MultiTMS
VEDACIT_API_BASE_URL=https://api.exemplo-vedacit.com.br/NFe.svc
VEDACIT_API_TOKEN=TOKEN_VEDACIT
VEDACIT_SOAP_CONNECT_TIMEOUT_MS=30000
VEDACIT_SOAP_READ_TIMEOUT_MS=180000

# Scheduler e paginacao
APP_SCHEDULER_ENABLED=true
APP_ETL_REPESCAGEM_ENABLED=true
INTEGRATION_SCHEDULER_INTERVAL_MS=60000
INTEGRATION_MAX_PAGES_PER_CYCLE=10
ETL_INCREMENTAL_LOOKBACK_HOURS=24
ETL_PAGINATION_PACING_PAUSE_MS=30000

# Limites operacionais ESL Cloud
ESL_MIN_INTERVAL_BETWEEN_REQUESTS_MS=2000
ESL_TOO_MANY_REQUESTS_BACKOFF_MS=120000
ESL_TOO_MANY_REQUESTS_MAX_RETRIES=2
ESL_PERIOD_FREE_LIMIT_DAYS=30
ESL_PERIOD_MEDIUM_LIMIT_DAYS=183
ESL_PERIOD_MEDIUM_COOLDOWN_MS=3600000
ESL_PERIOD_LONG_COOLDOWN_MS=43200000
INTEGRATION_TRANSIENT_BACKOFF_MS=15000
# Retry exponencial restrito ao XML de CT-e Vedacit. Nao se aplica a recusas de negocio nem a CT-e sem chave.
VEDACIT_XML_RETRY_INITIAL_BACKOFF_MS=15000
VEDACIT_XML_RETRY_BACKOFF_MULTIPLIER=2
VEDACIT_XML_RETRY_MAX_BACKOFF_MS=120000

# Download de imagens assinadas
IMAGE_DOWNLOAD_CONNECT_TIMEOUT_SECONDS=30
IMAGE_DOWNLOAD_REQUEST_TIMEOUT_SECONDS=60
IMAGE_DOWNLOAD_MAX_ATTEMPTS=3
IMAGE_DOWNLOAD_RETRY_DELAY_MS=15000

# Logs
APP_LOG_LEVEL=INFO
APP_LOG_RETENTION_ENABLED=true
APP_LOG_RETENTION_DIRECTORY=logs
APP_LOG_RETENTION_INITIAL_DELAY_MS=60000
APP_LOG_RETENTION_INTERVAL_MS=900000
LOG_RETENTION_MAX_FILES=20
LOG_RETENTION_MAX_AGE_DAYS=30
LOG_RETENTION_MAX_TOTAL_MB=500
