[package]
name = "satelite-api-piloto"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio"] }
form_urlencoded = "1.2"
odbc-api = { version = "30.1", default-features = false, features = ["odbc_version_3_80", "wide"] }
jiff = "0.2"
java-properties = "2"
regex = "1"
r2d2 = "0.8"
rusqlite = { version = "0.43", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
subtle = "2.6"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "sync"] }
tokio-stream = "0.1"
